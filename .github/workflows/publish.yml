name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `registry-url` writes an .npmrc wired to NODE_AUTH_TOKEN, which is what
      # token auth needs. It was removed once while trying to make Trusted
      # Publishing work — correctly, because that same .npmrc defaults the
      # variable to the placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, and a token,
      # even a fake one, outranks OIDC. With a real token it belongs here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Check the built bundles exist
        run: |
          test -s lib/index.js || { echo "lib/index.js missing" >&2; exit 1; }
          test -s lib/client.js || { echo "lib/client.js missing" >&2; exit 1; }

      # Not `npm publish` — it cannot publish this package. Every combination
      # was tried, local and CI, granular token and Trusted Publishing's OIDC
      # token, and all four are refused with a bare `403 Forbidden - PUT` and
      # no response body. The OIDC exchange returns 201 and provenance signs,
      # so the credential and the trusted-publisher config are both fine.
      #
      # The same tarball PUT to the same URL with the same token returns
      # `{"success":true}`. `scripts/publish.mjs` does that — the registry's
      # documented publish endpoint, with ownership and version-conflict rules
      # still enforced server-side. Delete it if npm publish ever works again.
      #
      # NPM_TOKEN is a granular access token with Bypass 2FA and read-write on
      # this package. npm restricts bypass-2FA tokens for direct publishing
      # from January 2027, so this needs revisiting before then.
      - run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: What the registry actually said
        if: failure()
        run: tail -n 60 /home/runner/.npm/_logs/*-debug-0.log
