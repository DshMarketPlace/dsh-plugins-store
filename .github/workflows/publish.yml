name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Deliberately no `registry-url`. Given one, setup-node writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and defaults that variable
      # to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then
      # authenticates with the bogus token — a token outranks OIDC — and the
      # publish fails 403 while still signing a valid provenance statement,
      # which makes it look like trusted publishing is working.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # OIDC publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Check the built bundles exist
        run: |
          test -s lib/index.js || { echo "lib/index.js missing" >&2; exit 1; }
          test -s lib/client.js || { echo "lib/client.js missing" >&2; exit 1; }

      # Two-stage publish, because this account requires proof-of-presence
      # (a live 2FA check) for a publish and CI cannot provide one. A direct
      # `npm publish` is refused by the registry in 13ms — no auth round-trip,
      # no response body — which reads like a broken credential and is not:
      # the OIDC exchange succeeds and provenance signs fine.
      #
      # `npm stage publish` uploads the tarball and defers the 2FA proof. A
      # human then approves it:
      #
      #     npm stage list
      #     npm stage approve <stage-id>
      #
      # The trusted publisher grants both `npm publish` and `npm stage publish`
      # for exactly this reason.
      - run: npm stage publish --access public

      - name: How to finish the publish
        if: success()
        run: |
          echo "Staged. Approve it with 2FA to publish:"
          echo "  npm stage list"
          echo "  npm stage approve <stage-id>"

      - name: What the registry actually said
        if: failure()
        run: tail -n 60 /home/runner/.npm/_logs/*-debug-0.log
