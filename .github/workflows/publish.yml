name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Deliberately no `registry-url`. Given one, setup-node writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and defaults that variable
      # to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then
      # authenticates with the bogus token — a token outranks OIDC — and the
      # publish fails 403 while still signing a valid provenance statement,
      # which makes it look like trusted publishing is working.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # OIDC publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Check the built bundles exist
        run: |
          test -s lib/index.js || { echo "lib/index.js missing" >&2; exit 1; }
          test -s lib/client.js || { echo "lib/client.js missing" >&2; exit 1; }

      # Publishes through npm Trusted Publishing. The OIDC exchange itself
      # works — `POST /-/npm/v1/oidc/token/exchange` returns 201 and npm sets
      # the token — but the registry has answered the PUT with 403 from inside
      # `otplease`, which is npm's OTP path. If this fails again, the blocker
      # is the account's 2FA-for-writes setting, not this workflow.
      - run: npm publish --access public --loglevel silly
        id: publish

      # The registry puts its actual reason in the response body, which npm
      # swallows from stdout but writes to the debug log.
      - name: What the registry actually said
        if: failure()
        run: |
          echo "=== npm debug log ==="
          tail -n 200 /home/runner/.npm/_logs/*-debug-0.log
          echo "=== whoami with the OIDC token ==="
          npm whoami --registry https://registry.npmjs.org || true
