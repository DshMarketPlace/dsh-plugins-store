name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Deliberately no `registry-url`. Given one, setup-node writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and defaults that variable
      # to the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then
      # authenticates with the bogus token — a token outranks OIDC — and the
      # publish fails 403 while still signing a valid provenance statement,
      # which makes it look like trusted publishing is working.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # OIDC publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Check the built bundles exist
        run: |
          test -s lib/index.js || { echo "lib/index.js missing" >&2; exit 1; }
          test -s lib/client.js || { echo "lib/client.js missing" >&2; exit 1; }

      # Trusted Publishing. This does not currently work on this account and
      # the reason is not yet known — recorded here so it is not re-derived:
      #
      #   GitHub id-token .............................. 200
      #   POST /-/npm/v1/oidc/token/exchange/package/... 201, token set
      #   provenance signed and logged to Sigstore ..... ok
      #   PUT  /<package> .............................. 403 in 13ms, no body
      #   POST /-/stage/package/<package> .............. 403 in 17ms, no body
      #
      # The token is issued for this package specifically, then refused for
      # every write, instantly and without explanation.
      #
      # Ruled out: the placeholder NODE_AUTH_TOKEN that setup-node's
      # `registry-url` injects (a real bug, fixed — a token outranks OIDC);
      # the package-level publishing-access setting (changed, no effect); a
      # version conflict (0.1.2 is 404); a stuck staged entry (none); and
      # proof-of-presence, since `npm stage publish` exists precisely to defer
      # the 2FA proof and is refused the same way.
      #
      # Until this is understood, publish from a machine that can answer a 2FA
      # prompt:  npm publish --access public
      - run: npm publish --access public

      - name: What the registry actually said
        if: failure()
        run: tail -n 60 /home/runner/.npm/_logs/*-debug-0.log
