name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `registry-url` writes an .npmrc wired to NODE_AUTH_TOKEN, which is what
      # token auth needs. It was removed once while trying to make Trusted
      # Publishing work — correctly, because that same .npmrc defaults the
      # variable to the placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, and a token,
      # even a fake one, outranks OIDC. With a real token it belongs here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm test

      - run: npm run build

      - name: Check the built bundles exist
        run: |
          test -s lib/index.js || { echo "lib/index.js missing" >&2; exit 1; }
          test -s lib/client.js || { echo "lib/client.js missing" >&2; exit 1; }

      # NPM_TOKEN is a granular access token with "Bypass 2FA" enabled and
      # read-write on this package. Bypass 2FA is required: CI cannot answer an
      # OTP challenge, and npm restricts these tokens for direct publishing from
      # January 2027, so this needs revisiting before then.
      #
      # Trusted Publishing was tried first and does not work on this account.
      # Recorded so it is not re-derived:
      #
      #   GitHub id-token .............................. 200
      #   POST /-/npm/v1/oidc/token/exchange/package/... 201, token set
      #   provenance signed and logged to Sigstore ..... ok
      #   PUT  /<package> .............................. 403, no body
      #   POST /-/stage/package/<package> .............. 403, no body
      #
      # Ruled out: the placeholder NODE_AUTH_TOKEN above (a real bug, fixed);
      # the package-level publishing-access setting (both options tried); the
      # Trusted Publisher config itself (deleted, no change); a version
      # conflict; a stuck staged entry; and proof-of-presence, since
      # `npm stage publish` exists to defer the 2FA proof and is refused too.
      #
      # A raw `PUT` of the same payload with this same token returns 200, so
      # the account can write to this package — something about the request npm
      # sends is what gets refused. Unresolved.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: What the registry actually said
        if: failure()
        run: tail -n 60 /home/runner/.npm/_logs/*-debug-0.log
